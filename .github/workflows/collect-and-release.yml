name: Collect and release artifacts

on:
  push:
    branches: ['master']
    paths:
      - 'src/**'

permissions:
  contents: write

jobs:
  collect-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run collect script
        run: npm run collect

      - name: Find output directory
        id: find_output
        run: |
          for d in ./collect-output ./output ./dist ./reports ./build; do
            if [ -d "$d" ] && [ "$(ls -A "$d")" ]; then
              echo "OUTDIR=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "Nenhum diretório de saída encontrado entre: collect-output, output, dist, reports, build" >&2
          exit 1

      - name: Zip artifacts
        run: |
          zip -r artifacts.zip "${{ steps.find_output.outputs.OUTDIR }}"

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: collect-${{ github.sha }}
          name: collect-${{ github.sha }}
          files: artifacts.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
